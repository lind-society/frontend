# Ships main to the VPS. The build runs on the server (docker compose), so this
# job only packs the source and hands it to /opt/lind-society/bin/deploy.sh,
# which rolls back on a failed build or health check.
#
# Secrets: DEPLOY_SSH_KEY (key restricted on the server to `deploy <app>`),
#          DEPLOY_KNOWN_HOSTS (ssh-keyscan of the VPS).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP: frontend
  HOST: root@185.196.21.56

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS kosong atau tidak terbaca oleh repo ini"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          # Strip CRs: keys pasted from Windows otherwise fail with "invalid format".
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY bukan private key yang valid (pastikan baris BEGIN/END ikut tersalin)"
            exit 1
          fi

      - name: Deploy
        run: |
          git ls-files -z | tar --null -czf - -T - \
            | ssh -o BatchMode=yes "$HOST" deploy "$APP"
