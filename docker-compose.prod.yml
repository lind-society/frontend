# Production stack for the VPS, deployed by .github/workflows/deploy.yml.
name: lind-admin

services:
  admin:
    build: .
    image: lind-admin:latest
    restart: unless-stopped
    ports: ['127.0.0.1:18081:80']
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    mem_limit: 128m
